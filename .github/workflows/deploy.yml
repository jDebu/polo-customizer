name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_ACTIONS: true
          VITE_SHEETS_URL: ${{ secrets.VITE_SHEETS_URL }}
          VITE_IMGBB_KEY: ${{ secrets.VITE_IMGBB_KEY }}
          VITE_TELEGRAM_TOKEN: ${{ secrets.VITE_TELEGRAM_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
          VITE_ADMIN_PIN: ${{ secrets.VITE_ADMIN_PIN }}
          VITE_YAPE_NUMBER: ${{ secrets.VITE_YAPE_NUMBER }}
          VITE_PLIN_NUMBER: ${{ secrets.VITE_PLIN_NUMBER }}
          VITE_DRIVE_URL: ${{ secrets.VITE_DRIVE_URL }}
          VITE_DRIVE_TOKEN: ${{ secrets.VITE_DRIVE_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
